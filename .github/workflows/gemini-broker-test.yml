name: Testar broker Gemini (sem segredo)
on:
  workflow_dispatch:
  push:
    branches:
      - feat/gemini-live-secure
    paths:
      - 'backend/**'
      - '.github/workflows/gemini-broker-test.yml'
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test backend/server.test.mjs
