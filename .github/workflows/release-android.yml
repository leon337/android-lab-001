name: Publicar versão Android assinada

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag estável já enviada ao GitHub (ex.: v1.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Compilar, assinar e publicar APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validar tag e segredos de assinatura
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use uma tag estável no formato vMAJOR.MINOR.PATCH."
            exit 1
          fi
          for name in ANDROID_SIGNING_KEYSTORE_BASE64 ANDROID_SIGNING_STORE_PASSWORD ANDROID_SIGNING_KEY_ALIAS ANDROID_SIGNING_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::O segredo $name não está configurado no repositório."
              exit 1
            fi
          done

      - name: Baixar código da tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: "false"

      - name: Instalar plataforma e build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Preparar assinatura temporária
        shell: bash
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gemini-live-release.p12"
          chmod 600 "$RUNNER_TEMP/gemini-live-release.p12"

      - name: Compilar APK de release assinado
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          VERSION_NAME="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          if (( VERSION_CODE < 1 || VERSION_CODE > 2100000000 )); then
            echo "::error::Version code fora do intervalo Android."
            exit 1
          fi
          gradle --no-daemon :app:assembleRelease \
            -PappVersionName="$VERSION_NAME" \
            -PappVersionCode="$VERSION_CODE" \
            -PandroidSigningStoreFile="$RUNNER_TEMP/gemini-live-release.p12"
          APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK_SOURCE"
          APK_NAME="gemini-live-$VERSION_NAME.apk"
          cp "$APK_SOURCE" "$APK_NAME"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK_NAME"
          CERT_SHA256=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK_NAME" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {gsub(/:/, "", $2); print toupper($2); exit}')
          APK_SHA256=$(sha256sum "$APK_NAME" | awk '{print $1}')
          test -n "$CERT_SHA256"
          export VERSION_NAME VERSION_CODE APK_NAME APK_SHA256 CERT_SHA256
          python3 - <<'PY'
          import json, os
          manifest = {
              "schemaVersion": 1,
              "packageName": "br.com.laboratorio.android",
              "versionName": os.environ["VERSION_NAME"],
              "versionCode": int(os.environ["VERSION_CODE"]),
              "minSdk": 26,
              "apkAsset": os.environ["APK_NAME"],
              "apkSha256": os.environ["APK_SHA256"],
              "signingCertificateSha256": os.environ["CERT_SHA256"],
          }
          with open("update-manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Publicar GitHub Release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Já existe uma release para $TAG. Releases publicadas são imutáveis neste fluxo."
            exit 1
          fi
          gh release create "$TAG" "$APK_NAME" update-manifest.json \
            --verify-tag \
            --title "Gemini Live $VERSION_NAME" \
            --notes "Versão $VERSION_NAME do Gemini Live Android. APK assinado, com manifesto e SHA-256 para atualização segura pelo aplicativo."

      - name: Guardar evidências do release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-live-release-${{ inputs.tag }}
          path: |
            gemini-live-*.apk
            update-manifest.json
          if-no-files-found: warn
          retention-days: 30
